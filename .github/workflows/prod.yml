name: Terraform Multi-Stage Deployment

on:
  push:
    branches:
      - prod
    paths:
      - "infra/**"
      - ".github/workflows/prod.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.14.0"
  TF_WORKING_DIRECTORY: "infra"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  prod-plan:
    name: Prod - Terraform Plan
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Prod backend
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform init \
            -reconfigure \
            -backend-config="environments/prod/backend.hcl"

      - name: Create Prod plan
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform plan \
            -var-file="environments/prod/prod.tfvars" \
            -out="prod.tfplan"

      - name: Generate readable Prod plan
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform show -no-color prod.tfplan > prod-plan.txt

      - name: Add Prod plan to job summary
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        shell: bash
        run: |
          {
            echo "## Production Terraform Plan"
            echo ""
            echo '```terraform'
            cat prod-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Prod Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: prod-terraform-plan
          path: |
            infra/prod.tfplan
            infra/prod-plan.txt
          retention-days: 1
          if-no-files-found: error

  prod-apply:
    name: Prod - Approval and Terraform Apply
    runs-on: ubuntu-latest

    needs:
      - prod-plan

    environment:
      name: prod

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Prod backend
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform init \
            -reconfigure \
            -backend-config="environments/prod/backend.hcl"

      - name: Download approved Prod Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: prod-terraform-plan
          path: infra

      - name: Apply Prod Terraform plan
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform apply -auto-approve prod.tfplan

      - name: Show Terraform outputs
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform output