name: Infrastructure CI/CD

on:
  push:
    branches:
      - infra

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  TF_VERSION: "1.13.5"
  TF_WORKING_DIRECTORY: infra

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest

    environment: production
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout infra branch
        uses: actions/checkout@v4
        with:
          ref: infra

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform format check
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      - name: Display non-sensitive outputs
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        shell: bash
        run: |
          echo "Infrastructure deployment completed."

          DETAILS="$(terraform output -json details)"
          DATABASE_URL="$(echo "$DETAILS" | jq -r '.database_host.database1')"
          VM_PUBLIC_IP="$(echo "$DETAILS" | jq -r '.public_ips.ip1')"

          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "null" ]; then
            echo "database_host.database1 output was not found."
            exit 1
          fi
          if [ -z "$VM_PUBLIC_IP" ] || [ "$VM_PUBLIC_IP" = "null" ]; then
            echo "public_ips.ip1 output was not found."
            exit 1
          fi
          
          echo "::add-mask::$DATABASE_URL"

          {
            echo "DATABASE_URL<<EOF"
            echo "$DATABASE_URL"
            echo "EOF"
            echo "VM_PUBLIC_IP=$VM_PUBLIC_IP"
          } >> "$GITHUB_ENV"
      
          echo "vm_public_ip=$VM_PUBLIC_IP" >> "$GITHUB_OUTPUT"