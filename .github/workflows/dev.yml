name: deploy dev env

on:
    push:
        branches:
            - dev
        paths:
            - "infra/**"
            - ".github/workflows/dev.yml"
        paths-ignore:
            - ".github/workflows/terraform-destroy.yml"

    workflow_dispatch:

permissions:
    contents: read
    id-token: write

concurrency:
    group: terraform-${{ github.ref }}
    cancel-in-progress: false

env:
    TF_VERSION: "1.14.0"
    TF_WORKING_DIRECTORY: "infra"
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"

jobs:
    dev-plan:
        name: Dev - Terraform Plan
        runs-on: ubuntu-latest

        env:
            ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
            ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
            ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            ARM_USE_OIDC: "true"
            ARM_USE_AZUREAD: "true"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}
                  terraform_wrapper: false

            - name: Azure login using OIDC
              uses: azure/login@v2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Initialize Dev backend
              working-directory: ${{ env.TF_WORKING_DIRECTORY }}
              run: |
                  terraform init \
                    -reconfigure \
                    -backend-config="environments/dev/backend.hcl"

            - name: Create Dev plan
              working-directory: ${{ env.TF_WORKING_DIRECTORY }}
              run: |
                  terraform plan \
                    -var-file="environments/dev/dev.tfvars" \
                    -out="dev.tfplan"

            - name: Generate readable Dev plan
              working-directory: ${{ env.TF_WORKING_DIRECTORY }}
              run: terraform show -no-color dev.tfplan > dev-plan.txt

            - name: Upload Dev Terraform plan
              uses: actions/upload-artifact@v4
              with:
                  name: dev-terraform-plan
                  path: |
                      infra/dev.tfplan
                      infra/dev-plan.txt
                  retention-days: 1
                  if-no-files-found: error

            - name: Upload Dev plan preview
              uses: actions/upload-artifact@v4
              with:
                  name: dev-plan-preview
                  path: infra/dev-plan.txt
                  retention-days: 5
                  if-no-files-found: error

    dev-apply:
        name: Dev - Terraform Apply
        runs-on: ubuntu-latest

        needs:
            - dev-plan

        if: github.event_name != 'pull_request'

        environment:
            name: dev

        env:
            ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
            ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
            ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            ARM_USE_OIDC: "true"
            ARM_USE_AZUREAD: "true"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}
                  terraform_wrapper: false

            - name: Azure login using OIDC
              uses: azure/login@v2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Initialize Dev backend
              working-directory: ${{ env.TF_WORKING_DIRECTORY }}
              run: |
                  terraform init \
                    -reconfigure \
                    -backend-config="environments/dev/backend.hcl"

            - name: Download Dev Terraform plan
              uses: actions/download-artifact@v4
              with:
                  name: dev-terraform-plan
                  path: infra

            - name: Apply Dev Terraform plan
              working-directory: ${{ env.TF_WORKING_DIRECTORY }}
              run: terraform apply -auto-approve dev.tfplan