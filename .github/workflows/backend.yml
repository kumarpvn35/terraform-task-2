name: Backend CI/CD

on:
  push:
    branches:
      - backend

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  TF_VERSION: "1.13.5"
  DOTNET_VERSION: "8.0.x"
  BACKEND_PROJECT: backend/UserApi/UserApi.csproj
  PUBLISH_DIRECTORY: backend/publish
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  infrastructure:
    name: Check and Apply Infrastructure
    runs-on:
      - self-hosted
      - Linux
      - X64
      - dotnet-production

    environment: production

    outputs:
      infrastructure_changed: ${{ steps.plan-result.outputs.has_changes }}

    steps:
      # The workflow was triggered from the backend branch, but this job
      # specifically checks out the infra branch.
      - name: Checkout infra branch
        uses: actions/checkout@v4
        with:
          ref: infra
          path: infra-source

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform format check
        working-directory: infra-source/infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infra-source/infra
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infra-source/infra
        run: terraform validate

      - name: Check Terraform plan
        id: terraform-plan
        working-directory: infra-source/infra
        shell: bash
        run: |
          set +e

          terraform plan \
            -input=false \
            -detailed-exitcode \
            -out=tfplan

          PLAN_EXIT_CODE=$?

          set -e

          echo "Terraform plan exit code: ${PLAN_EXIT_CODE}"

          if [ "${PLAN_EXIT_CODE}" -eq 0 ]; then
            echo "Terraform has no infrastructure changes."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"

          elif [ "${PLAN_EXIT_CODE}" -eq 2 ]; then
            echo "Terraform infrastructure changes were detected."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"

          else
            echo "Terraform plan failed."
            exit "${PLAN_EXIT_CODE}"
          fi

      - name: Export plan result
        id: plan-result
        shell: bash
        run: |
          echo "has_changes=${{ steps.terraform-plan.outputs.has_changes }}" \
            >> "$GITHUB_OUTPUT"

      - name: Apply infrastructure changes
        if: steps.terraform-plan.outputs.has_changes == 'true'
        working-directory: infra-source/infra
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      - name: No infrastructure changes
        if: steps.terraform-plan.outputs.has_changes == 'false'
        run: |
          echo "Infrastructure is already up to date."
          echo "Skipping Terraform apply."

  backend:
    name: Build and Deploy Backend
    runs-on:
      - self-hosted
      - Linux
      - X64
      - dotnet-production

    needs:
      - infrastructure

    environment: production

    steps:
      # Checkout the branch that triggered this workflow: backend.
      - name: Checkout backend branch
        uses: actions/checkout@v4
        with:
          ref: backend

      # Checkout infra separately because we need its remote-state outputs.
      - name: Checkout infra branch
        uses: actions/checkout@v4
        with:
          ref: infra
          path: infra-source

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init for outputs
        working-directory: infra-source/infra
        run: terraform init -input=false

      - name: Read infrastructure outputs
        id: infrastructure-outputs
        working-directory: infra-source/infra
        shell: bash
        run: |
          set -euo pipefail
          DETAILS="$(terraform output -json details)"
          DATABASE_URL="$(jq -r '.database_host.database1' <<< "$DETAILS")"
          VM_PUBLIC_IP="$(jq -r '.public_ips.ip1' <<< "$DETAILS")"

          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "null" ]; then
            echo "Terraform output details.database_host.database1 is missing."
            exit 1
          fi

          if [ -z "$VM_PUBLIC_IP" ] || [ "$VM_PUBLIC_IP" = "null" ]; then
            echo "Terraform output details.public_ips.ip1 is missing."
            exit 1
          fi

          # Prevent GitHub from displaying these values in logs.
          echo "::add-mask::${DATABASE_URL}"
          echo "::add-mask::${VM_PUBLIC_IP}"

          # Save only for later steps in the same job.
          {
            echo "DATABASE_URL<<EOF"
            echo "${DATABASE_URL}"
            echo "EOF"

            echo "VM_PUBLIC_IP=${VM_PUBLIC_IP}"
          } >> "$GITHUB_ENV"

          echo "vm_public_ip=$VM_PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "Terraform outputs loaded successfully."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore backend
        run: |
          dotnet restore "${{ env.BACKEND_PROJECT }}"

      - name: Build backend
        run: |
          dotnet build \
            "${{ env.BACKEND_PROJECT }}" \
            --configuration Release \
            --no-restore

      - name: Publish backend
        run: |
          rm -rf "${{ env.PUBLISH_DIRECTORY }}"

          dotnet publish \
            "${{ env.BACKEND_PROJECT }}" \
            --configuration Release \
            --no-build \
            --output "${{ env.PUBLISH_DIRECTORY }}"

      - name: Create deployment package
        shell: bash
        run: |
          tar \
            -czf backend-release.tar.gz \
            -C "${{ env.PUBLISH_DIRECTORY }}" \
            .

      - name: Configure SSH private key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/azure-vm-key

          chmod 600 ~/.ssh/azure-vm-key

          ssh-keyscan \
            -H "${VM_PUBLIC_IP}" \
            >> ~/.ssh/known_hosts

      - name: Upload backend package
        shell: bash
        env:
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
        run: |
          scp \
            -i ~/.ssh/azure-vm-key \
            backend-release.tar.gz \
            "${VM_USERNAME}@${VM_PUBLIC_IP}:/tmp/backend-release.tar.gz"

      - name: Deploy backend on Azure VM
        shell: bash
        env:
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
        run: |
          ssh \
            -i ~/.ssh/azure-vm-key \
            "${VM_USERNAME}@${VM_PUBLIC_IP}" \
            'sudo bash -s' <<'REMOTE_SCRIPT'
              set -euo pipefail

              APP_DIRECTORY="/var/www/dotnet-app"

              echo "Creating deployment directories..."
              mkdir -p "${APP_DIRECTORY}"

              echo "Stopping application..."
              systemctl stop dotnet-app || true

              echo "Cleaning previous deployment..."
              find "${APP_DIRECTORY}" \
                -mindepth 1 \
                -maxdepth 1 \
                -exec rm -rf {} +

              echo "Extracting new application..."
              tar \
                -xzf /tmp/backend-release.tar.gz \
                -C "${APP_DIRECTORY}"

              chown \
                -R dotnetapp:dotnetapp \
                "${APP_DIRECTORY}"

              echo "Restarting application..."
              systemctl daemon-reload
              systemctl restart dotnet-app
              systemctl enable dotnet-app

              echo "Checking service..."
              systemctl is-active --quiet dotnet-app

              rm -f /tmp/backend-release.tar.gz

              echo "Backend deployment completed."
          REMOTE_SCRIPT

      - name: Verify backend locally on VM
        shell: bash
        env:
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
        run: |
          ssh \
            -i ~/.ssh/azure-vm-key \
            "${VM_USERNAME}@${VM_PUBLIC_IP}" \
            'curl --fail --silent --show-error http://127.0.0.1:5000/swagger/index.html'