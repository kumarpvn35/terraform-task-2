#cloud-config

package_update: true
package_upgrade: false

packages:
  - nginx
  - aspnetcore-runtime-8.0
  - curl
  - unzip
  - jq

write_files:

  # Starts the published ASP.NET Core application.
  # The application DLL is discovered automatically using the
  # *.runtimeconfig.json file generated by dotnet publish.
  - path: /usr/local/bin/start-dotnet-app
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash

      set -euo pipefail

      APP_DIRECTORY="/var/www/dotnet-app"

      if [ ! -d "${APP_DIRECTORY}" ]; then
        echo "Application directory does not exist: ${APP_DIRECTORY}"
        exit 1
      fi

      cd "${APP_DIRECTORY}"

      RUNTIME_CONFIG="$(
        find "${APP_DIRECTORY}" \
          -maxdepth 1 \
          -type f \
          -name "*.runtimeconfig.json" \
          -print \
          -quit
      )"

      if [ -z "${RUNTIME_CONFIG}" ]; then
        echo "No *.runtimeconfig.json file found in ${APP_DIRECTORY}"
        echo "Copy the output of 'dotnet publish' into ${APP_DIRECTORY}"
        exit 1
      fi

      APP_NAME="$(basename "${RUNTIME_CONFIG}" ".runtimeconfig.json")"
      APP_DLL="${APP_DIRECTORY}/${APP_NAME}.dll"

      if [ ! -f "${APP_DLL}" ]; then
        echo "Application DLL not found: ${APP_DLL}"
        exit 1
      fi

      echo "Starting ASP.NET Core application: ${APP_DLL}"

      exec /usr/bin/dotnet "${APP_DLL}"

  # Deployment helper.
  #
  # Usage:
  #   sudo deploy-dotnet-app
  #
  # This script:
  #   - validates the deployment directory
  #   - validates the published application
  #   - fixes permissions
  #   - reloads systemd
  #   - restarts the application service
  #   - displays logs when startup fails
  - path: /usr/local/bin/deploy-dotnet-app
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash

      set -euo pipefail

      APP_DIRECTORY="/var/www/dotnet-app"
      SERVICE_NAME="dotnet-app.service"

      if [ "$(id -u)" -ne 0 ]; then
        echo "Run this command using sudo:"
        echo "sudo deploy-dotnet-app"
        exit 1
      fi

      if [ ! -d "${APP_DIRECTORY}" ]; then
        echo "Application directory does not exist: ${APP_DIRECTORY}"
        exit 1
      fi

      RUNTIME_CONFIG="$(
        find "${APP_DIRECTORY}" \
          -maxdepth 1 \
          -type f \
          -name "*.runtimeconfig.json" \
          -print \
          -quit
      )"

      if [ -z "${RUNTIME_CONFIG}" ]; then
        echo "No published .NET application was found."
        echo
        echo "Copy the output of:"
        echo "  dotnet publish -c Release"
        echo
        echo "into:"
        echo "  ${APP_DIRECTORY}"
        exit 1
      fi

      APP_NAME="$(basename "${RUNTIME_CONFIG}" ".runtimeconfig.json")"
      APP_DLL="${APP_DIRECTORY}/${APP_NAME}.dll"

      if [ ! -f "${APP_DLL}" ]; then
        echo "Application DLL not found: ${APP_DLL}"
        exit 1
      fi

      echo "Preparing application files..."

      chown -R dotnetapp:dotnetapp "${APP_DIRECTORY}"

      find "${APP_DIRECTORY}" \
        -type d \
        -exec chmod 750 {} \;

      find "${APP_DIRECTORY}" \
        -type f \
        -exec chmod 640 {} \;

      # Give native executables execution permission.
      # Framework-dependent publish output normally starts through dotnet,
      # but some publish folders can contain native helper executables.
      find "${APP_DIRECTORY}" \
        -maxdepth 1 \
        -type f \
        ! -name "*.*" \
        -exec chmod 750 {} \;

      echo "Reloading systemd configuration..."

      systemctl daemon-reload
      systemctl enable "${SERVICE_NAME}"

      echo "Restarting application service..."

      systemctl restart "${SERVICE_NAME}"

      sleep 3

      if ! systemctl is-active --quiet "${SERVICE_NAME}"; then
        echo
        echo "Application failed to start."
        echo

        systemctl \
          --no-pager \
          --full \
          status "${SERVICE_NAME}" || true

        echo
        echo "Recent application logs:"
        echo

        journalctl \
          -u "${SERVICE_NAME}" \
          --no-pager \
          -n 100 || true

        exit 1
      fi

      echo
      systemctl \
        --no-pager \
        --full \
        status "${SERVICE_NAME}"

      echo
      echo "Application deployed successfully."
      echo "Application name: ${APP_NAME}"
      echo "Application address: http://127.0.0.1:5000"
      echo "Nginx address: http://$(hostname -I | awk '{print $1}')"

  # Optional helper to clear the current deployment directory safely.
  #
  # Usage:
  #   sudo clear-dotnet-app
  - path: /usr/local/bin/clear-dotnet-app
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash

      set -euo pipefail

      APP_DIRECTORY="/var/www/dotnet-app"

      if [ "$(id -u)" -ne 0 ]; then
        echo "Run this command using sudo:"
        echo "sudo clear-dotnet-app"
        exit 1
      fi

      systemctl stop dotnet-app.service 2>/dev/null || true

      find "${APP_DIRECTORY}" \
        -mindepth 1 \
        -maxdepth 1 \
        -exec rm -rf -- {} +

      chown dotnetapp:dotnetapp "${APP_DIRECTORY}"
      chmod 750 "${APP_DIRECTORY}"

      echo "Application directory cleared: ${APP_DIRECTORY}"

  # Environment variables for the ASP.NET Core application.
  #
  # Add ASP.NET Core configuration using double underscores.
  #
  # Example:
  # ConnectionStrings__DefaultConnection=Host=server;Database=db;Username=user;Password=password
  - path: /etc/dotnet-app.env
    permissions: "0640"
    owner: root:root
    content: |
      ASPNETCORE_ENVIRONMENT=Production
      ASPNETCORE_URLS=http://127.0.0.1:5000
      DOTNET_PRINT_TELEMETRY_MESSAGE=false
      DOTNET_CLI_TELEMETRY_OPTOUT=1

      # Add application settings below.
      #
      # ConnectionStrings__DefaultConnection=Host=database-host;Database=mydb;Username=myuser;Password=mypassword
      # Jwt__Authority=https://example.com
      # Jwt__Audience=my-api

  # systemd service for the ASP.NET Core application.
  - path: /etc/systemd/system/dotnet-app.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=ASP.NET Core Application
      Documentation=https://learn.microsoft.com/aspnet/core/
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple

      User=dotnetapp
      Group=dotnetapp

      WorkingDirectory=/var/www/dotnet-app
      ExecStart=/usr/local/bin/start-dotnet-app

      EnvironmentFile=/etc/dotnet-app.env

      Restart=always
      RestartSec=5

      KillSignal=SIGINT
      SyslogIdentifier=dotnet-app

      TimeoutStartSec=30
      TimeoutStopSec=30

      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=full
      ProtectHome=true

      ReadWritePaths=/var/www/dotnet-app

      [Install]
      WantedBy=multi-user.target

  # Nginx reverse-proxy configuration.
  - path: /etc/nginx/sites-available/dotnet-app
    permissions: "0644"
    owner: root:root
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          server_name _;

          client_max_body_size 100M;

          location / {
              proxy_pass http://127.0.0.1:5000;
              proxy_http_version 1.1;

              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Forwarded-Host $host;

              proxy_connect_timeout 60s;
              proxy_send_timeout 60s;
              proxy_read_timeout 60s;

              proxy_buffering off;
          }

          location /health {
              proxy_pass http://127.0.0.1:5000/health;
              proxy_http_version 1.1;

              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;

              access_log off;
          }
      }

runcmd:

  # Create the dedicated application group if it does not exist.
  - |
      if ! getent group dotnetapp >/dev/null; then
        groupadd --system dotnetapp
      fi

  # Create the dedicated non-login application user if it does not exist.
  - |
      if ! id dotnetapp >/dev/null 2>&1; then
        useradd \
          --system \
          --gid dotnetapp \
          --home-dir /var/www/dotnet-app \
          --shell /usr/sbin/nologin \
          --no-create-home \
          dotnetapp
      fi

  # Create the application deployment directory.
  - mkdir -p /var/www/dotnet-app
  - chown -R dotnetapp:dotnetapp /var/www/dotnet-app
  - chmod 750 /var/www/dotnet-app

  # Allow the application user to read the environment file.
  - chown root:dotnetapp /etc/dotnet-app.env
  - chmod 640 /etc/dotnet-app.env

  # Ensure helper scripts are executable.
  - chmod 755 /usr/local/bin/start-dotnet-app
  - chmod 755 /usr/local/bin/deploy-dotnet-app
  - chmod 755 /usr/local/bin/clear-dotnet-app

  # Remove the default Nginx website.
  - rm -f /etc/nginx/sites-enabled/default

  # Enable the ASP.NET Core Nginx website.
  - ln -sfn /etc/nginx/sites-available/dotnet-app /etc/nginx/sites-enabled/dotnet-app

  # Validate Nginx configuration.
  - nginx -t

  # Reload systemd after creating the application service.
  - systemctl daemon-reload

  # Enable and restart Nginx.
  - systemctl enable nginx.service
  - systemctl restart nginx.service

  # Enable the application service.
  #
  # The service is intentionally not started here because the published
  # application has not been copied into /var/www/dotnet-app yet.
  - systemctl enable dotnet-app.service

  # Create a cloud-init completion marker.
  - touch /var/log/dotnet-cloud-init-complete


  - sudo useradd --create-home --shell /bin/bash githubrunner
  - sudo mkdir -p /opt/actions-runner
  - sudo chown githubrunner:githubrunner /opt/actions-runner


  - sudo -iu githubrunner
  - cd /opt/actions-runner
  - mkdir actions-runner && cd actions-runner
  - curl -o actions-runner-linux-x64-2.335.1.tar.gz -L https://github.com/actions/runner/releases/download/v2.335.1/actions-runner-linux-x64-2.335.1.tar.gz
  - echo "4ef2f25285f0ae4477f1fe1e346db76d2f3ebf03824e2ddd1973a2819bf6c8cf  actions-runner-linux-x64-2.335.1.tar.gz" | shasum -a 256 -c
  - tar xzf ./actions-runner-linux-x64-2.335.1.tar.gz

  - ./config.sh --url https://github.com/kumarpvn35/terraform-task-2 --token ALKNKVXVYYSSF5QEHBUM4SDKLHK5E
  - ./run.sh

final_message: |
  .NET VM initialization completed successfully.

  Application directory:

    /var/www/dotnet-app

  Copy your published ASP.NET Core application into that directory.

  Then run:

    sudo deploy-dotnet-app

  Useful commands:

    sudo systemctl status dotnet-app --no-pager
    sudo journalctl -u dotnet-app -n 100 --no-pager
    sudo systemctl status nginx --no-pager
    sudo nginx -t